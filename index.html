<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索可能クロスワード</title>
    <style>
        /* AIっぽさを消し、シンプルで少し温かみのあるデザインに */
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #fcfcfc;
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            padding: 20px 0;
            text-align: center;
            border-bottom: 2px solid #eee;
            background-color: #fff;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            color: #444;
            letter-spacing: 1px;
        }

        main {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        .catchphrase {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        /* 「検索してもいい」をマーカー風に強調 */
        .highlight {
            background: linear-gradient(transparent 60%, #ffea00 60%);
            padding: 0 4px;
            display: inline-block;
        }

        .play-button {
            display: inline-block;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            transition: background-color 0.2s ease;
        }

        .play-button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1>検索可能クロスワード</h1>
    </header>

    <main>
        <p class="catchphrase">
            クロスワード、ただし<span class="highlight">検索してもいい</span>
        </p>

        <!-- ゲーム開始への導線など（必要に応じて変更してください） -->
        <a href="game.html" class="play-button">遊んでみる</a>
    </main>

</body>
</html>
