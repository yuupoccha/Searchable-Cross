<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索可能クロスワード</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #fcfcfc;
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            padding: 20px 0;
            text-align: center;
            border-bottom: 2px solid #eee;
            background-color: #fff;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            color: #444;
            letter-spacing: 1px;
        }

        main {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        .catchphrase {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        /* 「検索してもいい」をマーカー風に強調 */
        .highlight {
            background: linear-gradient(transparent 60%, #ffea00 60%);
            padding: 0 4px;
            display: inline-block;
        }

        /* ボタン配置用の縦並びコンテナ */
        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* 大きめの薄い黄緑ボタン */
        .btn-main {
            display: inline-block;
            background-color: #d9f99d; /* 薄い黄緑 */
            color: #275204; /* 視認性の良い濃いめの文字 */
            text-decoration: none;
            padding: 16px 48px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            transition: background-color 0.2s ease;
        }

        .btn-main:hover {
            background-color: #bef264;
        }

        /* 小さめで灰色のボタン */
        .btn-sub {
            display: inline-block;
            background-color: #f1f5f9; /* 明るめの灰色 */
            color: #64748b; /* 落ち着いた灰色の文字 */
            border: 1px solid #cbd5e1;
            text-decoration: none;
            padding: 8px 20px;
            font-size: 14px;
            border-radius: 20px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn-sub:hover {
            background-color: #e2e8f0;
            color: #334155;
        }
    </style>
</head>
<body>

    <header>
        <h1>検索可能クロスワード</h1>
    </header>

    <main>
        <p class="catchphrase">
            クロスワード、ただし<span class="highlight">検索してもいい</span>
        </p>

        <div class="button-group">
            <a href="questions.html" class="btn-main">問題一覧へ</a>
            <a href="whatis.html" class="btn-sub">検索可能クロスワードとは？</a>
        </div>
    </main>

</body>
</html>
